openapi: 3.0.3
info:
  title: TJ Platform - módulo platform
  version: 1.0.0
  description: |
    Contrato de comunicação do núcleo compartilhado (platform). Descreve
    caminhos, esquemas e segurança; não contém regras de negócio.
servers:
  - url: /
tags:
  - name: platform
    description: Operações do núcleo compartilhado.
paths:
  /healthz:
    get:
      operationId: getHealth
      tags: [platform]
      summary: Estado da API e do banco de dados.
      security: []
      responses:
        '200':
          description: API e banco disponíveis.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: ok
        '503':
          description: Banco de dados indisponível.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: degraded
components:
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, degraded]
