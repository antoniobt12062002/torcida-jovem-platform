name: CI

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [develop, main, 'release/**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docs: ${{ steps.out.outputs.docs }}
      api: ${{ steps.out.outputs.api }}
      web: ${{ steps.out.outputs.web }}
      contract: ${{ steps.out.outputs.contract }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: f
        if: github.event_name == 'pull_request'
        with:
          filters: |
            docs:
              - 'docs/**'
              - '**/*.md'
              - '.markdownlint.json'
            api:
              - 'api/**'
            web:
              - 'web/**'
            contract:
              - 'api/openapi/**'
              - 'api/internal/**/generate.go'
              - 'api/internal/**/api.gen.go'
              - 'api/go.mod'
              - 'api/go.sum'
              - 'web/redocly.yaml'
              - 'web/lib/api/**'
              - 'web/package.json'
              - 'web/pnpm-lock.yaml'
              - '.github/workflows/ci.yml'
      - id: out
        env:
          EVENT: ${{ github.event_name }}
          DOCS: ${{ steps.f.outputs.docs }}
          API: ${{ steps.f.outputs.api }}
          WEB: ${{ steps.f.outputs.web }}
          CONTRACT: ${{ steps.f.outputs.contract }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            echo "docs=$DOCS" >> "$GITHUB_OUTPUT"
            echo "api=$API" >> "$GITHUB_OUTPUT"
            echo "web=$WEB" >> "$GITHUB_OUTPUT"
            echo "contract=$CONTRACT" >> "$GITHUB_OUTPUT"
          else
            echo "docs=true" >> "$GITHUB_OUTPUT"
            echo "api=true" >> "$GITHUB_OUTPUT"
            echo "web=true" >> "$GITHUB_OUTPUT"
            echo "contract=true" >> "$GITHUB_OUTPUT"
          fi

  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: |
            **/*.md
            !web/**
            !**/node_modules/**
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --exclude-path web './**/*.md'
          fail: true

  api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - run: go vet ./...
      - run: go vet -tags=integration ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          working-directory: api
          args: --build-tags=integration
      - name: Testes de unidade (sem Docker)
        run: go test ./...
      - name: Testes de integração (PostgreSQL via testcontainers)
        run: go test -tags=integration ./...
      - run: go build ./...

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm exec next typegen
      - run: pnpm exec tsc --noEmit
      - name: Testes do front (Vitest)
        run: pnpm test
      - run: pnpm build

  contract:
    needs: changes
    if: needs.changes.outputs.contract == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Instala dependências do front
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Lint dos contratos OpenAPI
        working-directory: web
        run: pnpm lint:api
      - name: Código Go gerado está em dia
        working-directory: api
        run: |
          go generate ./...
          git diff --exit-code -- .
      - name: Tipos TypeScript gerados estão em dia
        working-directory: web
        run: pnpm gen:api:check

  ci-gate:
    if: always()
    needs: [pr-title, changes, docs, api, web, contract]
    runs-on: ubuntu-latest
    steps:
      - name: Falha se algum job falhou ou foi cancelado
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Resultados: $RESULTS"
          case " $RESULTS " in
            *" failure "*|*" cancelled "*) exit 1 ;;
          esac
